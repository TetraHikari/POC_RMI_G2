services:
  db:
    image: postgres:17-alpine
    container_name: rmi-postgres
    environment:
      # From .env (see .env.template); defaults are for local dev only
      POSTGRES_DB: ${POSTGRES_DB:-rmi}
      POSTGRES_USER: ${POSTGRES_USER:-rmi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rmi}
      TZ: Asia/Bangkok
      PGTZ: Asia/Bangkok
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"   # localhost only
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro   # schema + mock load, first start only
      - ./db/data:/data:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
